{{define "detail"}}
<div class="detail-panel" role="dialog" aria-label="Task detail" data-detail-panel>
  <form class="detail-form"
        hx-post="/tasks/{{.Task.ID}}"
        hx-target="#task-{{.Task.ID}}"
        hx-swap="outerHTML">
    <input type="hidden" name="view" value="{{.View}}">

    <header class="detail-head">
      <h2 class="sr-only">Task detail</h2>
      <button type="button" class="detail-close" data-close-detail aria-label="Close">×</button>
    </header>

    <label class="field">
      <span class="field-label">Task</span>
      <textarea class="field-input field-title" name="title" rows="2">{{.Task.Title}}</textarea>
    </label>

    <div class="field-row">
      <label class="field">
        <span class="field-label">Topic</span>
        <input class="field-input sg-topic" name="topic" value="{{.Task.Topic}}">
      </label>
      <label class="field">
        <span class="field-label">Due</span>
        <input class="field-input sg-due" name="due" placeholder="today, eow, 25/12"
               value="{{if .Task.Due}}{{due .Task.Due}}{{end}}">
      </label>
    </div>

    <div class="field-row">
      <label class="field">
        <span class="field-label">Waiting on</span>
        <input class="field-input sg-who" name="assignee" placeholder="nobody" value="{{.Task.Assignee}}">
      </label>
      <label class="field">
        <span class="field-label">Priority</span>
        <select class="field-input sg-pri" name="priority">
          <option value="0"{{if eq .Task.Priority 0}} selected{{end}}>Normal</option>
          <option value="1"{{if eq .Task.Priority 1}} selected{{end}}>! High</option>
          <option value="2"{{if eq .Task.Priority 2}} selected{{end}}>!! Urgent</option>
          <option value="3"{{if eq .Task.Priority 3}} selected{{end}}>!!! Critical</option>
        </select>
      </label>
    </div>

    <label class="field">
      <span class="field-label">Tags</span>
      <input class="field-input sg-tag" name="tags" placeholder="compliance, q3"
             value="{{range $i, $t := .Task.Tags}}{{if $i}}, {{end}}{{$t}}{{end}}">
    </label>

    <label class="field">
      <span class="field-label">Notes</span>
      <textarea class="field-input field-note" name="note" rows="6"
                placeholder="Context, links, what was actually said.">{{.Task.Note}}</textarea>
    </label>

    <footer class="detail-foot">
      <button type="submit" class="btn btn-go">Save</button>
      <button type="button" class="btn btn-danger"
              hx-post="/tasks/{{.Task.ID}}/delete"
              hx-target="#task-{{.Task.ID}}"
              hx-swap="delete"
             >Delete</button>
    </footer>

    {{if .Task.Raw}}
    <p class="detail-source">
      <span class="detail-source-label">Captured as</span>
      <code class="pv-raw">{{template "raw" .Task.Raw}}</code>
    </p>
    {{end}}
  </form>
</div>
{{end}}
